# Required metadata
sonar.projectKey=zk-credential
sonar.organization=abyalax
sonar.host.url=https://sonarcloud.io

# Project display name
sonar.projectName=ZK-Credential

# Project version
sonar.projectVersion=0.1.0

# Source code location
sonar.sources=src,scripts,circuits/tests,experiments
sonar.tests=tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/artifacts/**,**/cache/**,**/*.config.ts,**/contracts/**

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.tsconfigPaths=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# JavaScript/TypeScript version
sonar.typescript.node=22.13.0
